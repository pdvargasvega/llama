name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.pdvargasvega.llama LlamaApp
          cp -r www/* myapp/www/
          cd myapp
          cordova platform add android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK & AAB Files
        run: |
          cd myapp
          cordova build android --debug
          cordova build android --release -- --packageType=bundle

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: myapp/platforms/android/app/build/outputs/bundle/release/app-release.aab
