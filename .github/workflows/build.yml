name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Inspect Repository Structure
        run: |
          echo "=== Carpeta Raíz ==="
          ls -la
          echo "=== Contenido de www ==="
          ls -la www || echo "La carpeta www no existe o no se puede leer"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Initialize Capacitor Config
        run: |
          npx cap init "LlamaApp" "com.pdvargasvega.llama" --web-dir "www"

      - name: Add Android & Copy Web Assets
        env:
          DEBUG: "*"
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r www/* android/app/src/main/assets/public/ || true
          npx cap add android || true
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK & AAB Files
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
